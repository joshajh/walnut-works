version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-your_secure_password_here}
    volumes:
      # Mount database volume to persist data
      - db-data:/app
    restart: unless-stopped
    # No ports exposed - Dokploy's Traefik will handle routing
    # For local testing, uncomment the following:
    # ports:
    #   - "3000:3000"

volumes:
  db-data:
